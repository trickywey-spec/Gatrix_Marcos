<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#082650">
  <title>Reservas y turnos · GATRIX CarWash</title>
  <link rel="icon" href="/img/Logo.png" type="image/png">
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/css/admin.css?v=4">
<link rel="stylesheet" href="/css/gatrix-forms-nav.css?v=8">
<link rel="stylesheet" href="/css/roles-gatrix.css?v=10">
</head><body>
<div th:replace="~{fragments/admin :: menu}"></div><main class="admin-content">
  <div class="page-heading"><div><span class="eyebrow">AGENDA / RESERVAS</span><h1>Reservas y turnos</h1><p>Consulta, filtra y actualiza el estado de cada atención.</p></div><a th:href="@{/reservas.html}" class="btn btn-outline-primary" target="_blank">Ver formulario <i class="fa-solid fa-arrow-up-right-from-square ms-1"></i></a></div>
  <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
  <div class="surface-card"><form class="filter-bar" method="get" th:action="@{/admin/reservas}"><div class="filter-search"><i class="fa-solid fa-magnifying-glass"></i><input name="q" class="form-control" th:value="${q}" placeholder="Buscar nombre, código o placa..." aria-label="Buscar reservas"></div>
    <select name="estado" class="form-select" aria-label="Filtrar estado"><option value="">Todos los estados</option><option th:each="e : ${estados}" th:value="${e}" th:text="${e}" th:selected="${estadoFiltro == e}"></option></select><button class="btn btn-primary"><i class="fa-solid fa-filter me-2"></i>Filtrar</button></form>
    <div class="table-responsive"><table class="table modern-table"><thead><tr><th>Cliente / Código</th><th>Servicio / Vehículo</th><th>Turno</th><th>Importe</th><th>Estado</th><th>Actualizar</th></tr></thead><tbody>
    <tr th:each="r : ${reservas.content}"><td><strong th:text="${r.nombreCompleto}"></strong><small class="d-block text-muted" th:text="${r.codigo}"></small><small class="d-block text-muted" th:text="${r.telefono}"></small></td>
    <td><div class="cell-truncate" th:title="${r.resumenServicios}" th:text="${r.resumenServicios}"></div><small class="text-muted" th:text="${r.tipoVehiculo + ' · ' + r.cantidadVehiculos + ' unid.'}"></small></td>
    <td><b th:text="${#temporals.format(r.fecha,'dd/MM/yyyy')}"></b><small class="d-block text-muted" th:text="${r.hora}"></small></td><td th:text="${'S/ ' + r.precioTotal}"></td><td><span class="status-badge" th:classappend="${'st-' + #strings.toLowerCase(r.estado.name())}" th:text="${r.estado}"></span></td>
    <td><div class="mb-2"><form method="post" class="d-flex gap-1 flex-wrap" th:action="@{/admin/reservas/{id}/asignar(id=${r.idReserva})}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<select name="empleadoId" class="form-select form-select-sm" aria-label="Trabajador asignado" style="max-width:160px" th:disabled="${r.estado.name()=='CANCELADA' or r.estado.name()=='COMPLETADA'}">
<option value="">Sin asignar</option><option th:each="e:${trabajadores}" th:value="${e.idEmpleado}"
 th:selected="${r.empleadoAsignado != null and r.empleadoAsignado.idEmpleado==e.idEmpleado}" th:text="${e.nombres+' '+e.apellidos}"></option></select>
<button class="btn btn-outline-primary btn-sm" type="submit" th:disabled="${r.estado.name()=='CANCELADA' or r.estado.name()=='COMPLETADA'}" title="Asignar personal">Asignar</button>
</form></div><div class="d-flex gap-2 align-items-center flex-wrap">
    <a class="btn btn-sm btn-outline-primary" th:if="${(r.estado.name() == 'PENDIENTE' or r.estado.name() == 'CONFIRMADA') and !pagadas.contains(r.idReserva)}" th:href="@{/admin/reservas/{id}/editar(id=${r.idReserva})}">Editar</a>
    <form method="post" class="d-flex gap-2" data-confirm="¿Confirmas el cambio de estado de esta reserva?" th:if="${r.estado.name() != 'CANCELADA' and r.estado.name() != 'COMPLETADA'}" th:action="@{/admin/reservas/{id}/estado(id=${r.idReserva})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <select class="form-select form-select-sm" name="estado" required aria-label="Nuevo estado"><option th:if="${r.estado.name() == 'PENDIENTE'}" value="CONFIRMADA">Confirmar</option><option th:if="${r.estado.name() == 'PENDIENTE' or r.estado.name() == 'CONFIRMADA'}" value="CANCELADA">Cancelar</option><option th:if="${r.estado.name() == 'CONFIRMADA'}" value="EN_PROCESO">Iniciar</option><option th:if="${r.estado.name() == 'EN_PROCESO'}" value="COMPLETADA">Finalizar</option></select><button type="submit" class="btn btn-sm btn-primary" title="Cambiar estado"><i class="fa-solid fa-check"></i></button></form><span th:if="${r.estado.name() == 'CANCELADA' or r.estado.name() == 'COMPLETADA'}" class="text-muted small">Cerrada</span></div></td></tr>
    <tr th:if="${reservas.empty}"><td colspan="6" class="empty-state">No encontramos reservas con estos filtros.</td></tr></tbody></table></div>
    <nav th:if="${reservas.totalPages > 1}" class="d-flex justify-content-between align-items-center flex-wrap gap-3 mt-3" aria-label="Páginas de reservas"><span class="text-muted small" th:text="${'Página ' + (reservas.number + 1) + ' de ' + reservas.totalPages}"></span><div class="d-flex gap-2"><a th:if="${reservas.hasPrevious()}" class="btn btn-outline-primary btn-sm" th:href="@{/admin/reservas(page=${reservas.number-1},estado=${estadoFiltro},q=${q})}">Anterior</a><a th:if="${reservas.hasNext()}" class="btn btn-outline-primary btn-sm" th:href="@{/admin/reservas(page=${reservas.number+1},estado=${estadoFiltro},q=${q})}">Siguiente</a></div></nav>
  </div></main><div th:replace="~{fragments/admin :: pie}"></div><script src="/js/gatrix-validation.js?v=8" defer></script>
</body></html>
