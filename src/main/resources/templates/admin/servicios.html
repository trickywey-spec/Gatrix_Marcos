<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#082650">
  <title>Catálogo de servicios · GATRIX CarWash</title>
  <link rel="icon" href="/img/Logo.png" type="image/png">
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/css/admin.css?v=4">
<link rel="stylesheet" href="/css/gatrix-forms-nav.css?v=8">
<link rel="stylesheet" href="/css/roles-gatrix.css?v=10">
</head><body>
<div th:replace="~{fragments/admin :: menu}"></div><main class="admin-content">
  <div class="page-heading"><div><span class="eyebrow">CATÁLOGO / PRECIOS</span><h1>Servicios de lavado</h1><p>Los precios de aquí se muestran automáticamente en la web y las reservas.</p></div><a th:href="@{/admin/servicios/nuevo}" class="btn btn-primary"><i class="fa-solid fa-plus me-2"></i>Nuevo servicio</a></div>
  <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
  <div class="surface-card"><div class="table-responsive"><table class="table modern-table"><thead><tr><th>Servicio</th><th>Precio al público</th><th>Disponibilidad</th><th class="text-end">Acciones</th></tr></thead><tbody>
  <tr th:each="s : ${servicios}"><td><strong th:text="${s.nombre}">Lavado</strong><small class="d-block text-muted" th:text="${s.descripcion}">Descripción</small></td><td><strong th:text="${'S/ ' + s.precio}">S/ 0.00</strong></td><td><span class="status-badge" th:classappend="${s.activo ? 'st-completada' : 'st-cancelada'}" th:text="${s.activo ? 'PUBLICADO' : 'OCULTO'}"></span></td>
  <td><div class="d-flex justify-content-end gap-2 flex-wrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/servicios/editar/{id}(id=${s.id})}"><i class="fa-solid fa-pen me-1"></i>Editar</a><form method="post" data-confirm="¿Cambiar la visibilidad de este servicio?" th:action="@{/admin/servicios/{id}/alternar(id=${s.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-secondary" type="submit" th:text="${s.activo ? 'Ocultar' : 'Publicar'}">Ocultar</button></form>
    <form method="post" th:if="${s.activo}" data-confirm="¿Retirar el servicio del catálogo? Las reservas históricas se conservarán." th:action="@{/admin/servicios/{id}/eliminar(id=${s.id})}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="btn btn-sm btn-outline-danger">Retirar</button>
    </form></div></td></tr>
  <tr th:if="${#lists.isEmpty(servicios)}"><td colspan="4" class="empty-state">No hay servicios en el catálogo.</td></tr>
  </tbody></table></div></div>
</main><div th:replace="~{fragments/admin :: pie}"></div><script src="/js/gatrix-validation.js?v=8" defer></script>
</body></html>
