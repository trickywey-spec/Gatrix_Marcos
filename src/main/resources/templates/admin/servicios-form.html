<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#082650">
  <title>Editar servicio · GATRIX CarWash</title>
  <link rel="icon" href="/img/Logo.png" type="image/png">
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/css/admin.css?v=4">
<link rel="stylesheet" href="/css/gatrix-forms-nav.css?v=8">
<link rel="stylesheet" href="/css/roles-gatrix.css?v=10">
</head><body><div th:replace="~{fragments/admin :: menu}"></div><main class="admin-content">
  <div class="page-heading"><div><span class="eyebrow">CATÁLOGO / EDITOR</span><h1 th:text="${servicio.id == null ? 'Nuevo servicio' : 'Editar servicio'}">Servicio</h1><p>La información que guardes aparecerá en el sitio público.</p></div></div>
  <div class="surface-card form-surface"><form th:object="${servicio}" th:action="@{/admin/servicios/guardar}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{id}">
    <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">Verifica los campos señalados antes de guardar.</div>
    <div class="mb-3"><label class="form-label" for="nombre">Nombre del servicio</label><input class="form-control" id="nombre" th:field="*{nombre}" maxlength="140" required placeholder="Ej.: Lavado Premium"><div class="text-danger small" th:errors="*{nombre}"></div></div>
    <div class="mb-3"><label class="form-label" for="descripcion">Descripción</label><textarea class="form-control" id="descripcion" th:field="*{descripcion}" rows="3" maxlength="500"></textarea><div class="text-danger small" th:errors="*{descripcion}"></div></div>
    <div class="mb-3"><label class="form-label" for="precio">Precio final (S/)</label><input class="form-control" id="precio" type="number" th:field="*{precio}" min="0" step="0.01" required data-validate="decimal" inputmode="decimal"><div class="text-danger small" th:errors="*{precio}"></div></div>
    <div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="activo" th:field="*{activo}"><label class="form-check-label" for="activo">Mostrar en el sitio público</label></div>
    <div class="d-flex gap-2"><button class="btn btn-primary" type="submit"><i class="fa-solid fa-floppy-disk me-2"></i>Guardar cambios</button><a th:href="@{/admin/servicios}" class="btn btn-outline-secondary">Cancelar</a></div>
  </form></div>
</main><div th:replace="~{fragments/admin :: pie}"></div><script src="/js/gatrix-validation.js?v=8" defer></script>
</body></html>
