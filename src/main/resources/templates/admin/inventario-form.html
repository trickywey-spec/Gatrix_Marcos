<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#082650">
  <title>Artículo de inventario · GATRIX CarWash</title>
  <link rel="icon" href="/img/Logo.png" type="image/png">
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/css/admin.css?v=4">
<link rel="stylesheet" href="/css/gatrix-forms-nav.css?v=8">
<link rel="stylesheet" href="/css/roles-gatrix.css?v=10">
</head>
<body><div th:replace="~{fragments/admin :: menu}"></div><main class="container py-5" style="max-width:850px"><h1 class="page-title" th:text="${articulo.idArticulo==null?'Nuevo artículo':'Editar artículo'}"></h1>
<div class="card admin-card p-4"><form th:action="@{/admin/inventario/guardar}" th:object="${articulo}" method="post">
<input type="hidden" th:field="*{idArticulo}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">Verifica los campos ingresados.</div>
<div class="row g-3"><div class="col-md-6"><label class="form-label">Nombre</label><input class="form-control" th:field="*{nombre}" th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" maxlength="120" required></div>
<div class="col-md-6"><label class="form-label">Categoría</label><input class="form-control" th:field="*{categoria}" th:classappend="${#fields.hasErrors('categoria')} ? 'is-invalid'" maxlength="70" required></div>
<div class="col-md-4"><label class="form-label">Unidad</label><input class="form-control" th:field="*{unidad}" th:classappend="${#fields.hasErrors('unidad')} ? 'is-invalid'" required></div>
<div class="col-md-4"><label class="form-label">Stock</label><input class="form-control" type="number" min="0" th:field="*{stock}" th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid'" required data-validate="integer" inputmode="numeric"></div>
<div class="col-md-4"><label class="form-label">Stock mínimo</label><input class="form-control" type="number" min="0" th:field="*{minimo}" th:classappend="${#fields.hasErrors('minimo')} ? 'is-invalid'" required data-validate="integer" inputmode="numeric"></div>
<div class="col-md-6"><label class="form-label">Costo unitario (S/)</label><input class="form-control" type="number" min="0" step="0.01" th:field="*{costoUnitario}" th:classappend="${#fields.hasErrors('costoUnitario')} ? 'is-invalid'" required data-validate="decimal" inputmode="decimal"></div>
<div class="col-md-6"><label class="form-label">Activo</label><select class="form-select" th:field="*{activo}"><option value="true">Sí</option><option value="false">No</option></select></div></div>
<div class="mt-4 d-flex gap-2"><button class="btn btn-primary">Guardar</button><a class="btn btn-outline-secondary" th:href="@{/admin/inventario}">Volver</a></div></form></div>
</main><div th:replace="~{fragments/admin :: pie}"></div><script src="/js/gatrix-validation.js?v=8" defer></script>
</body></html>
