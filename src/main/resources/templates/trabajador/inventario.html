<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventario disponible · GATRIX Marcos</title>
<link rel="icon" href="/img/gatrix-logo-corporativo.png">
<link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="/css/admin.css?v=10"><link rel="stylesheet" href="/css/roles-gatrix.css?v=10"></head>
<body><div th:replace="~{fragments/trabajador :: menu}"></div>
<main class="admin-content"><div class="page-heading"><div><span class="eyebrow">ÁREA DEL TRABAJADOR / SOLO CONSULTA</span>
<h1>Inventario disponible</h1><p>Vista de consulta. Los cambios están reservados al administrador.</p></div>
<a class="btn btn-outline-primary" th:href="@{/trabajador}">Volver a mis atenciones</a></div>
<section class="surface-card"><div class="table-responsive"><table class="table modern-table"><thead><tr><th>Producto</th><th>Categoría</th><th>Existencias</th><th>Mínimo</th></tr></thead><tbody>
<tr th:each="s : ${articulos}"><td th:text="${s.nombre}"></td><td th:text="${s.categoria}"></td><td th:text="${s.stock}"></td><td th:text="${s.minimo}"></td></tr>
<tr th:if="${#lists.isEmpty(articulos)}"><td colspan="4" class="empty-state">Sin registros disponibles.</td></tr>
</tbody></table></div></section></main><div th:replace="~{fragments/admin :: pie}"></div></body></html>
