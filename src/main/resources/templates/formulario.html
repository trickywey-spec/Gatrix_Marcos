<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#082650">
  <title>Editar usuario · GATRIX CarWash</title>
  <link rel="icon" href="/img/Logo.png" type="image/png">
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/css/admin.css?v=4">
<link rel="stylesheet" href="/css/gatrix-forms-nav.css?v=8">
<link rel="stylesheet" href="/css/roles-gatrix.css?v=10">
</head>
<body><div th:replace="~{fragments/admin :: menu}"></div><main class="admin-content"><h1 class="subpage-title" th:text="${usuarioForm.idUsuario==null?'Crear usuario':'Editar usuario'}"></h1>
<div class="card admin-card p-4"><div th:if="${errorUsuario}" class="alert alert-danger" th:text="${errorUsuario}"></div>

<div class="alert alert-warning" th:if="${#lists.isEmpty(empleados)}">Primero crea un empleado. <a th:href="@{/empleados/nuevo}">Registrar empleado</a></div>
<form method="post" th:action="@{/usuarios/guardar}" th:object="${usuarioForm}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{idUsuario}">
<div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">Revisa los datos del formulario.</div>
<div class="mb-3"><label class="form-label">Empleado</label><select th:field="*{idEmpleado}" class="form-select" required><option value="">Seleccione</option>
<option th:each="e:${empleados}" th:value="${e.idEmpleado}" th:text="${e.nombres+' '+e.apellidos}"></option></select><div class="text-danger small" th:errors="*{idEmpleado}"></div></div>
<div class="mb-3"><label class="form-label">Nombre de usuario</label><input class="form-control" th:field="*{username}" required maxlength="50" autocomplete="off" data-validate="username"><div class="text-danger small" th:errors="*{username}"></div></div>
<div class="mb-3"><label class="form-label">Contraseña</label><input type="password" class="form-control" th:field="*{password}" minlength="8" th:required="${usuarioForm.idUsuario==null}" autocomplete="new-password"><div class="text-danger small" th:errors="*{password}"></div><small class="text-muted" th:if="${usuarioForm.idUsuario!=null}">Déjala vacía para conservar la contraseña actual.</small></div>
<div class="mb-3"><label class="form-label">Rol</label><select th:field="*{idRol}" class="form-select"><option value="1">Trabajador (panel de atenciones)</option><option value="2">Administrador (ADMIN)</option></select></div>
<div class="form-check mb-3"><input class="form-check-input" type="checkbox" th:field="*{activo}" value="true" id="activo"><label class="form-check-label" for="activo">Cuenta activa</label></div>
<button class="btn btn-primary">Guardar</button> <a class="btn btn-outline-secondary" th:href="@{/usuarios}">Volver</a></form></div>
</main><div th:replace="~{fragments/admin :: pie}"></div><script src="/js/gatrix-validation.js?v=8" defer></script>
</body></html>
