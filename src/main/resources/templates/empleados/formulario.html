<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#082650">
  <title>Empleado · GATRIX CarWash</title>
  <link rel="icon" href="/img/Logo.png" type="image/png">
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/css/admin.css?v=4">
<link rel="stylesheet" href="/css/gatrix-forms-nav.css?v=8">
<link rel="stylesheet" href="/css/roles-gatrix.css?v=10">
</head>
<body><div th:replace="~{fragments/admin :: menu}"></div><main class="admin-content"><h1 class="subpage-title" th:text="${empleado.idEmpleado==null?'Nuevo empleado':'Editar empleado'}"></h1>
<div class="card admin-card p-4"><form th:action="@{/empleados/guardar}" th:object="${empleado}" method="post"><input type="hidden" th:field="*{idEmpleado}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">Verifica los datos ingresados.</div><div class="row g-3">
<div class="col-md-6"><label class="form-label">Nombres</label><input class="form-control" th:field="*{nombres}" maxlength="100" required data-validate="name"><div class="text-danger small" th:errors="*{nombres}"></div></div>
<div class="col-md-6"><label class="form-label">Apellidos</label><input class="form-control" th:field="*{apellidos}" maxlength="100" required data-validate="name"><div class="text-danger small" th:errors="*{apellidos}"></div></div>
<div class="col-md-6"><label class="form-label">Teléfono</label><input class="form-control" th:field="*{telefono}" maxlength="9" pattern="9[0-9]{8}" data-validate="phone" inputmode="numeric"></div>
<div class="col-md-6"><label class="form-label">Fecha de contratación</label><input type="date" class="form-control" th:field="*{fechaContrato}"></div>
<div class="col-md-6"><label class="form-label">Salario base (S/)</label><input type="number" step="0.01" min="0" class="form-control" th:field="*{salarioBase}" data-validate="decimal" inputmode="decimal"></div>
<div class="col-md-6"><label class="form-label">Tipo contrato</label><select class="form-select" th:field="*{tipoContrato}"><option value="">Selecciona</option><option value="Tiempo Completo">Tiempo completo</option><option value="Medio Tiempo">Medio tiempo</option><option value="Practicante">Practicante</option><option value="Honorarios">Honorarios</option></select></div>
<div class="col-md-6"><label class="form-label">Activo</label><select class="form-select" th:field="*{activo}"><option value="true">Sí</option><option value="false">No</option></select></div>
</div><div class="mt-4"><button class="btn btn-primary">Guardar</button> <a class="btn btn-outline-secondary" th:href="@{/empleados}">Volver</a></div></form></div>
</main><div th:replace="~{fragments/admin :: pie}"></div><script src="/js/gatrix-validation.js?v=8" defer></script>
</body></html>
