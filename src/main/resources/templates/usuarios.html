<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#082650">
  <title>Usuarios · GATRIX CarWash</title>
  <link rel="icon" href="/img/Logo.png" type="image/png">
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/css/admin.css?v=4">
<link rel="stylesheet" href="/css/gatrix-forms-nav.css?v=8">
<link rel="stylesheet" href="/css/roles-gatrix.css?v=10">
</head>
<body><div th:replace="~{fragments/admin :: menu}"></div><main class="admin-content"><div class="d-flex justify-content-between flex-wrap mb-4"><h1 class="subpage-title">Usuarios y roles</h1><a th:href="@{/usuarios/nuevo}" class="btn btn-primary">+ Nuevo usuario</a></div>
<div th:if="${errorUsuario}" class="alert alert-danger" th:text="${errorUsuario}"></div><div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
<div class="card admin-card p-3"><div class="table-responsive"><table class="table"><thead><tr><th>ID</th><th>Usuario</th><th>Empleado</th><th>Rol</th><th>Activo</th><th>Acciones</th></tr></thead><tbody>
<tr th:each="u:${usuarios}"><td th:text="${u.idUsuario}"></td><td th:text="${u.username}"></td><td th:text="${u.empleado.nombres+' '+u.empleado.apellidos}"></td>
<td th:text="${u.idRol==2?'Administrador':'Trabajador'}"></td><td th:text="${u.activo?'Sí':'No'}"></td><td class="d-flex gap-2"><a class="btn btn-outline-primary btn-sm" th:href="@{/usuarios/editar/{id}(id=${u.idUsuario})}">Editar</a>
<form method="post" th:if="${u.username != 'admin'}" th:action="@{/usuarios/{id}/alternar(id=${u.idUsuario})}" data-confirm="¿Cambiar el estado de esta cuenta?">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<button class="btn btn-sm btn-outline-secondary" th:text="${u.activo ? 'Desactivar' : 'Activar'}"></button></form>
<form method="post" th:if="${u.username != 'admin'}" th:action="@{/usuarios/eliminar/{id}(id=${u.idUsuario})}" data-confirm="¿Eliminar definitivamente este usuario de PostgreSQL? El empleado permanecerá registrado."><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-outline-danger btn-sm">Eliminar</button></form></td></tr>
<tr th:if="${#lists.isEmpty(usuarios)}"><td colspan="6">No hay usuarios.</td></tr></tbody></table></div></div>
</main><div th:replace="~{fragments/admin :: pie}"></div><script src="/js/gatrix-validation.js?v=8" defer></script>
</body></html>
