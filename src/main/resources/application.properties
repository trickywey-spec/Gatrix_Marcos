spring.application.name=Gatrix_Marcos
server.port=${PORT:8081}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Gatrix_Marcos_Integral}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.thymeleaf.cache=false
spring.web.resources.cache.period=3600
server.error.include-message=never
app.admin.password=${APP_ADMIN_PASSWORD:1234}
